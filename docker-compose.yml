version: "3.9"

services:
  backend:
    build: ./CrediGest-Backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build: ./CrediGest-Frontend
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - credigest-data:/var/lib/postgresql/data

volumes:
  credigest-data: